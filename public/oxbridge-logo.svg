  <!-- Open book - right page -->
  <path d="M52 25 L40 23 L40 50 L52 52 Z" fill="#f7d454" opacity="0.9"/>
  
  <!-- Book binding -->
  <line x1="40" y1="23" x2="40" y2="50" stroke="#293863" stroke-width="2"/>
  
  <!-- Page lines left -->
  <line x1="30" y1="30" x2="38" y2="29.5" stroke="#33559a" stroke-width="0.8" opacity="0.5"/>
  <line x1="30" y1="34" x2="38" y2="33.5" stroke="#33559a" stroke-width="0.8" opacity="0.5"/>
  <line x1="30" y1="38" x2="38" y2="37.5" stroke="#33559a" stroke-width="0.8" opacity="0.5"/>
  <line x1="30" y1="42" x2="38" y2="41.5" stroke="#33559a" stroke-width="0.8" opacity="0.5"/>
  
  <!-- Page lines right -->
  <line x1="42" y1="29.5" x2="50" y2="30" stroke="#33559a" stroke-width="0.8" opacity="0.5"/>
  <line x1="42" y1="33.5" x2="50" y2="34" stroke="#33559a" stroke-width="0.8" opacity="0.5"/>
  <line x1="42" y1="37.5" x2="50" y2="38" stroke="#33559a" stroke-width="0.8" opacity="0.5"/>
  <line x1="42" y1="41.5" x2="50" y2="42" stroke="#33559a" stroke-width="0.8" opacity="0.5"/>
  
  <!-- Letter O -->
  <circle cx="40" cy="36" r="9" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.95"/>
  <circle cx="40" cy="36" r="6.5" fill="none" stroke="#953130" stroke-width="1" opacity="0.8"/>
</svg>
